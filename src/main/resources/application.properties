spring.application.name=expense-splitter

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=framework
spring.threads.virtual.enabled=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# MVC configuration
server.servlet.context-path=/api
spring.mvc.apiversion.default=1.0.0
spring.mvc.apiversion.use.header=X-API-Version
spring.mvc.apiversion.detect-supported=true

# Actuator configuration
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true

# Database configuration
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.defer-datasource-initialization=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# OAuth2 configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET}
spring.security.oauth2.client.registration.facebook.scope=email,public_profile
spring.security.oauth2.client.registration.facebook.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.facebook.authorization-uri=https://www.facebook.com/v14.0/dialog/oauth
spring.security.oauth2.client.provider.facebook.token-uri=https://graph.facebook.com/v14.0/oauth/access_token
spring.security.oauth2.client.provider.facebook.user-info-uri=https://graph.facebook.com/me?fields=id,name,email,first_name,last_name

# Email configuration
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:test}
spring.mail.password=${SPRING_MAIL_PASSWORD:test}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_AUTH_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_STARTTLS_ENABLE:true}
spring.mail.default-encoding=UTF-8

# Swagger configuration
springdoc.swagger-ui.enabled=${OPENAPI_ENABLED:true}
springdoc.api-docs.enabled=${OPENAPI_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.persist-authorization=true

# Sentry configuration
sentry.enabled=false

# Application variables
jwt.secret-key=${JWT_SECRET_KEY}
jwt.expiration-time-in-ms=${JWT_EXPIRATION_TIME_MS:3600000}
refresh-token.expiration-time-in-ms=${REFRESH_TOKEN_EXPIRATION_TIME_MS:604800000}
password-reset.token-expiration-time-in-ms=${PASSWORD_RESET_TOKEN_EXPIRATION_TIME_MS:3600000}
password-reset.frontend-url=${PASSWORD_RESET_FRONTEND_URL:http://localhost:3000/reset-password}
two-factor.encryption-key=${TWO_FA_ENCRYPTION_KEY}

es.first-admin.email=${ES_FIRST_ADMIN_EMAIL:admin@example.com}
es.first-admin.password=${ES_FIRST_ADMIN_PASSWORD:ES-Admin123#}
es.cors.allowed-origins=${ES_CORS_ALLOWED_ORIGINS:http://localhost:3000}
es.rate-limit.provider=${ES_RATE_LIMIT_PROVIDER:local}
es.scheduler.enabled=${ES_SCHEDULER_ENABLED:true}
